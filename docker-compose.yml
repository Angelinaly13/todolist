services:
  postgres:
    image: postgres:15
    container_name: todolist-postgres
    environment:
      POSTGRES_DB: todolist_db
      POSTGRES_USER: todolist_user
      POSTGRES_PASSWORD: todolist_password
    ports:
      - "5433:5432"
    volumes:
      - todolist_postgres_data:/var/lib/postgresql/data

volumes:
  todolist_postgres_data: