server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/todolist_db
    username: todolist_user
    password: todolist_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  name: To-Do List Manager
  version: 1.0.0
  environment: Development